appId: com.tordownloader.pro
productName: TorDownloader PRO
copyright: Copyright © 2025

publish:
  provider: github
  owner: latinokodi
  repo: tordownloader-pro

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: electron/qbit-plugins
    to: qbit-plugins
    filter:
      - "qbit-runner.exe"
      - "engines/**"
      - "novaprinter.py"
      - "helpers.py"
  - from: electron/latino-providers.py
    to: latino-providers.py
  - from: electron/tmdb-provider.py
    to: tmdb-provider.py

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TorDownloader PRO
  artifactName: TorDownloader-PRO-Setup-${version}.${ext}

asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"

npmRebuild: true
